catalogMode: prefer
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - tsnapi@1.5.0
  - vue-afloat@0.1.0
shellEmulator: true

trustPolicy: no-downgrade
update:
  ignoreDeps:
    - typescript@7
packages:
  - packages/*
  - storybook
  - playground

catalogs:
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.5.0
    bumpp: ^12.3.0
    eslint: ^10.10.0
    nano-staged: ^1.0.2
    publint: ^0.3.24
    simple-git-hooks: ^2.14.0
    skills-npm: ^1.2.1
    tsdown: ^0.23.0
    tsx: ^4.23.13
    typescript: ^6.0.3
    vite: ^8.3.0
  frontend:
    '@iconify-json/catppuccin': ^1.2.17
    '@iconify-json/ph': ^1.2.2
    '@tanstack/vue-virtual': ^3.13.38
    '@unocss/core': '>=66.10.2'
    '@unocss/eslint-plugin': ^66.10.2
    '@unocss/preset-icons': ^66.10.2
    '@unocss/preset-mini': ^66.10.2
    '@unocss/preset-web-fonts': ^66.10.2
    '@unocss/preset-wind3': ^66.10.2
    '@unocss/preset-wind4': ^66.10.2
    '@unocss/transformer-directives': ^66.10.2
    '@vitejs/plugin-vue': ^6.0.8
    '@vueuse/core': ^14.4.0
    colorjs.io: ^0.7.1
    dompurify: ^3.4.15
    reka-ui: ^2.10.4
    splitpanes: ^4.1.2
    unocss: ^66.10.2
    unplugin-vue: ^7.2.0
    vue: ^3.5.42
    vue-afloat: ^0.1.0
    vue-tsc: ^3.3.11
  inlined:
    '@antfu/utils': ^9.3.0
  storybook:
    '@storybook/addon-docs': ^10.6.0
    '@storybook/vue3-vite': ^10.6.0
    storybook: ^10.6.0

  testing:
    '@arethetypeswrong/cli': ^0.18.5
    '@axe-core/playwright': ^4.13.0
    '@vue/test-utils': ^2.5.0
    happy-dom: ^20.14.5
    magic-string: ^1.3.1
    playwright: ^1.63.0
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.5.0
    vitest: ^5.0.0
  types:
    '@types/node': ^26.5.1
allowBuilds:
  esbuild: true
  simple-git-hooks: true
  vue-demi: true
