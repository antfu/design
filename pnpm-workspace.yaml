ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - tsnapi@1.5.0
  - vue-afloat@0.1.1
  - '@antfu/ni@30.6.0'
  - '@types/node@26.6.1'
  - '@unocss/cli@66.10.4'
  - '@unocss/config@66.10.4'
  - '@unocss/core@66.10.4'
  - '@unocss/eslint-plugin@66.10.4'
  - '@unocss/extractor-arbitrary-variants@66.10.4'
  - '@unocss/inspector@66.10.4'
  - '@unocss/preset-attributify@66.10.4'
  - '@unocss/preset-icons@66.10.4'
  - '@unocss/preset-mini@66.10.4'
  - '@unocss/preset-tagify@66.10.4'
  - '@unocss/preset-typography@66.10.4'
  - '@unocss/preset-uno@66.10.4'
  - '@unocss/preset-web-fonts@66.10.4'
  - '@unocss/preset-wind3@66.10.4'
  - '@unocss/preset-wind4@66.10.4'
  - '@unocss/preset-wind@66.10.4'
  - '@unocss/rollup@66.10.4'
  - '@unocss/rule-utils@66.10.4'
  - '@unocss/transformer-attributify-jsx@66.10.4'
  - '@unocss/transformer-compile-class@66.10.4'
  - '@unocss/transformer-directives@66.10.4'
  - '@unocss/transformer-variant-group@66.10.4'
  - '@unocss/vite@66.10.4'
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - magic-string@1.4.1
  - unocss@66.10.4
  - vitest@5.0.1

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - packages/*
  - storybook
  - playground

allowBuilds:
  esbuild: true
  simple-git-hooks: true
  vue-demi: true

catalogs:
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.6.0
    bumpp: ^12.3.0
    eslint: ^10.10.0
    nano-staged: ^1.0.2
    publint: ^0.3.24
    simple-git-hooks: ^2.14.0
    skills-npm: ^1.2.1
    tsdown: ^0.23.0
    tsx: ^4.23.13
    typescript: ^6.0.3
    vite: ^8.3.0
  frontend:
    '@iconify-json/catppuccin': ^1.2.17
    '@iconify-json/ph': ^1.2.2
    '@tanstack/vue-virtual': ^3.13.39
    '@unocss/core': '>=66.10.4'
    '@unocss/eslint-plugin': ^66.10.4
    '@unocss/preset-icons': ^66.10.4
    '@unocss/preset-mini': ^66.10.4
    '@unocss/preset-web-fonts': ^66.10.4
    '@unocss/preset-wind3': ^66.10.4
    '@unocss/preset-wind4': ^66.10.4
    '@unocss/transformer-directives': ^66.10.4
    '@vitejs/plugin-vue': ^6.0.9
    '@vueuse/core': ^14.4.0
    colorjs.io: ^0.7.1
    dompurify: ^3.4.15
    reka-ui: ^2.10.4
    splitpanes: ^4.1.2
    unocss: ^66.10.4
    unplugin-vue: ^7.2.0
    vue: ^3.5.42
    vue-afloat: ^0.1.1
    vue-tsc: ^3.3.11
  inlined:
    '@antfu/utils': ^9.3.0
  storybook:
    '@storybook/addon-docs': ^10.6.0
    '@storybook/vue3-vite': ^10.6.0
    storybook: ^10.6.0

  testing:
    '@arethetypeswrong/cli': ^0.18.5
    '@axe-core/playwright': ^4.13.0
    '@vue/test-utils': ^2.5.0
    happy-dom: ^20.14.5
    magic-string: ^1.4.1
    playwright: ^1.63.0
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.5.0
    vitest: ^5.0.1
  types:
    '@types/node': ^26.6.1
